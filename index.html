<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일본어 마스터 앱 - Final Edition</title>
    <style>
        :root {
            --bg-color: #f8f9fa; --card-bg: #ffffff; --text-main: #212529;
            --text-sub: #495057; --border-color: #ced4da; --shadow: rgba(0,0,0,0.05);
        }
        [data-theme="dark"] {
            --bg-color: #121212; --card-bg: #1e1e1e; --text-main: #e0e0e0;
            --text-sub: #a0a0a0; --border-color: #444444;
        }
        body { font-family: sans-serif; background: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px 20px 80px; transition: 0.3s; }
        
        .theme-toggle { position: absolute; top: 20px; right: 20px; cursor: pointer; padding: 8px 12px; border-radius: 20px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); }
        .app-section { display: none; width: 100%; flex-direction: column; align-items: center; }
        .app-section.active { display: flex; }
        
        .card-wrapper { width: 320px; min-height: 320px; height: auto; perspective: 1000px; margin-bottom: 20px; }
        .card-inner { width: 100%; min-height: 320px; position: relative; transform-style: preserve-3d; transition: 0.5s; display: flex; }
        .card-inner.flipped { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; min-height: 320px; backface-visibility: hidden; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 25px; background: var(--card-bg); display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box; }
        .card-back { transform: rotateY(180deg); gap: 10px; }
        
        .question-text { font-size: 32px; font-weight: bold; margin-bottom: 20px; word-break: break-all; text-align: center; }
        .answer-input { width: 100%; padding: 12px; font-size: 18px; border: 2px solid var(--border-color); border-radius: 8px; text-align: center; background: var(--card-bg); color: var(--text-main); }
        
        .btn-main { width: 320px; padding: 14px; border: none; border-radius: 8px; background: #007bff; color: white; font-weight: bold; cursor: pointer; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: var(--card-bg); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--border-color); }
        .nav-btn { background: none; border: none; font-weight: bold; color: var(--text-sub); cursor: pointer; }
        .nav-btn.active { color: #007bff; }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 다크모드</button>

    <div id="wordSection" class="app-section active">
        <div style="margin-bottom:20px;">
            <input type="text" id="nicknameInput" style="padding:8px; width:280px; text-align:center;" placeholder="닉네임 입력 후 엔터" onkeypress="changeNickname(event)">
        </div>
        <div id="checkboxGroup" style="margin-bottom:20px;"></div>
        
        <div class="card-wrapper">
            <div class="card-inner" id="cardInner">
                <div class="card-front">
                    <div class="question-text" id="quizQuestion">데이터 로딩중...</div>
                    <input type="text" class="answer-input" id="userAnswer" placeholder="정답 입력" onkeypress="if(event.key==='Enter') handleMainButton()">
                    <div id="choiceGroup" style="display:none; flex-direction:column; gap:5px; width:100%;">
                        <button class="choice-btn" onclick="selectChoice(1)" id="c1"></button>
                        <button class="choice-btn" onclick="selectChoice(2)" id="c2"></button>
                        <button class="choice-btn" onclick="selectChoice(3)" id="c3"></button>
                        <button class="choice-btn" onclick="selectChoice(4)" id="c4"></button>
                    </div>
                </div>
                <div class="card-back">
                    <div id="resultStatus" style="font-size:24px; font-weight:bold;"></div>
                    <div id="resultAnswerDisplay" style="font-size:28px;"></div>
                    <div id="resultPronounceDisplay" style="font-size:18px; color:var(--text-sub);"></div>
                </div>
            </div>
        </div>
        <button class="btn-main" id="btnAction" onclick="handleMainButton()">확인</button>
    </div>

    <nav class="bottom-nav">
        <button class="nav-btn active" id="navWordBtn" onclick="switchTab('word')">✏️ 단어장</button>
        <button class="nav-btn" id="navRankBtn" onclick="switchTab('rank')">🏆 랭킹</button>
    </nav>

    <script>
        const spreadsheetId = "1P-EpIcEFuGvFO7kLzE4RuzZy4NxHuofPArlszI6VT2s";
        const scriptUrl = "https://script.google.com/macros/s/AKfycbyjrEMBl-b2b3jcUewUh5mEv3zLWIZyp14DRrwjBG_kCp1FVcBDJgVPIc6qkr7495SbFg/exec";
        
        let words = [], currentIndex = 0, isAnswerChecked = false, userNickname = "";

        // 통합 로직
        function initApp() {
            userNickname = localStorage.getItem('study_nickname') || "";
            document.getElementById('nicknameInput').value = userNickname;
            loadLessons();
        }

        async function loadLessons() {
            const url = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:csv&sheet=설정`;
            const res = await fetch(url);
            const data = await res.text();
            const rows = data.replace(/"/g, '').split('\n').slice(1);
            const group = document.getElementById('checkboxGroup');
            rows.forEach((name, i) => {
                if(!name) return;
                group.innerHTML += `<label><input type="checkbox" class="lesson-check" value="${name}" ${i==0?'checked':''} onclick="loadSelectedSheets()"> ${name}</label> `;
            });
            loadSelectedSheets();
        }

        async function loadSelectedSheets() {
            const selected = Array.from(document.querySelectorAll('.lesson-check:checked')).map(cb => cb.value);
            let all = [];
            for (let s of selected) {
                const res = await fetch(`https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(s)}`);
                const text = await res.text();
                all = all.concat(text.split('\n').slice(1).map(row => {
                    const c = row.replace(/"/g, '').split(',');
                    return { q: c[0], a: c[1], p: c[2], sim: c[3], type: c[4], c1: c[5], c2: c[6], c3: c[7], c4: c[8] };
                }).filter(r => r.q));
            }
            words = all;
            currentIndex = 0;
            shuffleArray(words);
            showQuestion();
        }

        function checkAnswer(userInput) {
            const currentQuiz = words[currentIndex];
            // 사용자가 입력한 값에서 공백 제거
            const cleanUserInput = userInput.replace(/\s+/g, '');
    
            // D열 데이터(currentQuiz.d_column)를 쉼표로 분리하여 배열로 만듦
            // 예: "나, 저" -> ["나", "저"]
            const answerOptions = currentQuiz.d_column.split(',').map(item => item.trim());
    
            // 사용자가 입력한 값이 정답 배열 중 하나라도 포함되는지 확인
            const isCorrect = answerOptions.some(ans => ans.replace(/\s+/g, '') === cleanUserInput);

            if (isCorrect) {
                // 정답 처리 로직
            } else {
                // 오답 처리 로직
            }
        }

        function handleMainButton() {
            if (isAnswerChecked) { currentIndex = (currentIndex + 1) % words.length; resetCardUI(); showQuestion(); }
            else { checkAnswer(document.getElementById('userAnswer').value); }
        }

        function resetCardUI() {
            isAnswerChecked = false;
            document.getElementById('userAnswer').value = "";
            document.getElementById('cardInner').classList.remove('flipped');
            document.getElementById('btnAction').innerText = "확인";
        }

        function shuffleArray(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } }
        function toggleTheme() { document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); }
        function changeNickname(e) { if(e.key==='Enter') localStorage.setItem('study_nickname', e.target.value); }
        window.onload = initApp;
    </script>
</body>
</html>
