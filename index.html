<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>닉네임 기록형 일본어 단어장</title>
    <style>
        body { font-family: sans-serif; background: #f8f9fa; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .options-container { background: white; padding: 15px 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; width: 320px; box-sizing: border-box; text-align: center; }
        .checkbox-group { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-top: 10px; max-height: 120px; overflow-y: auto; padding: 5px; }
        .checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 16px; cursor: pointer; width: 100%; }
        .btn-load { background: #28a745; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; margin-top: 12px; font-weight: bold; width: 100%; }
        
        /* 닉네임 설정 구역 */
        .login-box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; width: 320px; box-sizing: border-box; text-align: center; }
        .user-info-display { font-size: 14px; color: #555; margin-bottom: 8px; font-weight: bold; }

        .quiz-container { background: white; width: 320px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 25px; box-sizing: border-box; text-align: center; margin-bottom: 20px; }
        .question-text { font-size: 56px; font-weight: bold; color: #212529; margin-bottom: 20px; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        .answer-input { width: 100%; padding: 12px; font-size: 18px; border: 2px solid #ced4da; border-radius: 8px; box-sizing: border-box; text-align: center; margin-bottom: 15px; outline: none; }
        .answer-input:focus { border-color: #007bff; }
        .result-area { display: none; margin-top: 15px; padding: 15px; border-radius: 8px; font-size: 20px; font-weight: bold; }
        .result-area.correct { display: block; background: #d4edda; color: #155724; }
        .result-area.wrong { display: block; background: #f8d7da; color: #721c24; }
        .final-display { font-size: 24px; font-weight: bold; color: #333; margin-top: 8px; }
        .btn-main { width: 320px; padding: 14px; font-size: 18px; border-radius: 8px; border: none; background: #007bff; color: white; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="user-info-display" id="userInfoText">👤 내 닉네임 설정</div>
        <input type="text" id="nicknameInput" style="padding:8px; border:2px solid #007bff; border-radius:6px; width:85%; text-align:center; font-size:15px; font-weight:bold;" placeholder="닉네임을 입력하고 엔터" onkeypress="changeNickname(event)">
    </div>

    <div class="options-container">
        <div style="font-weight: bold; color: #495057;">📖 학습할 진도 선택</div>
        <div class="checkbox-group" id="checkboxGroup">
            <span style="color:#888; font-size:14px;">진도 목록 불러오는 중...</span>
        </div>
        <button class="btn-load" onclick="loadSelectedSheets()">단어장 시작/갱신</button>
    </div>

    <div class="quiz-container">
        <div class="question-text" id="quizQuestion">시작 버튼을 눌러주세요</div>
        <input type="text" class="answer-input" id="userAnswer" placeholder="정답을 입력하세요" onkeypress="handleKeyPress(event)">
        <div class="result-area" id="resultBox">
            <div id="resultStatus"></div>
            <div class="final-display" id="resultAnswerDisplay"></div>
        </div>
    </div>

    <button class="btn-main" id="btnAction" onclick="checkAnswer()">확인</button>

    <script>
        const spreadsheetId = "1P-EpIcEFuGvFO7kLzE4RuzZy4NxHuofPArlszI6VT2s";
        
        // ⚠️ 구글 앱스 스크립트 새 배포 후 받은 웹 앱 URL을 여기에 꼭 붙여넣으세요!
        const scriptUrl = "https://script.google.com/macros/s/AKfycbyjrEMBl-b2b3jcUewUh5mEv3zLWIZyp14DRrwjBG_kCp1FVcBDJgVPIc6qkr7495SbFg/exec";
        
        let words = [];
        let currentIndex = 0;
        let isAnswerChecked = false;
        let userNickname = "";

        // 브라우저에 저장된 기존 닉네임이 있으면 불러오고, 없으면 기본값 부여
        function initUser() {
            userNickname = localStorage.getItem('study_nickname');
            if(!userNickname) {
                userNickname = "익명_" + Math.floor(1000 + Math.random() * 9000);
                localStorage.setItem('study_nickname', userNickname);
            }
            document.getElementById('nicknameInput').value = userNickname;
            updateUserDisplay();
        }

        function changeNickname(e) {
            if (e.key === 'Enter') {
                const newName = document.getElementById('nicknameInput').value.trim();
                if(newName) {
                    userNickname = newName;
                    localStorage.setItem('study_nickname', userNickname);
                    updateUserDisplay();
                    //alert(`닉네임이 '${userNickname}'(으)로 설정되었습니다!`);
                }
            }
        }

        function updateUserDisplay() {
            document.getElementById('userInfoText').innerText = `👤 현재 사용자: ${userNickname}`;
        }

        // 구글 시트에 데이터 전송 (닉네임만 보냄)
        async function sendStudyRecord() {
            if(!scriptUrl.includes("macros/s/")) return; 
            
            const payload = { nickname: userNickname };
            
            try {
                fetch(scriptUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch(e) { console.error("기록 전송 실패:", e); }
        }

        async function initApp() {
            initUser();
            try {
                const url = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:csv&sheet=설정`;
                const response = await fetch(url);
                const data = await response.text();
                const rows = data.replace(/"/g, '').split('\n').map(row => row.trim());
                const checkboxGroup = document.getElementById('checkboxGroup');
                checkboxGroup.innerHTML = '';

                let count = 0;
                rows.slice(1).forEach(sheetName => {
                    if (sheetName) {
                        const checked = count === 0 ? 'checked' : '';
                        checkboxGroup.innerHTML += `
                            <label class="checkbox-label">
                                <input type="checkbox" class="lesson-check" value="${sheetName}" ${checked}> ${sheetName}
                            </label>
                        `;
                        count++;
                    }
                });
                if(count > 0) loadSelectedSheets();
            } catch (e) {
                document.getElementById('checkboxGroup').innerHTML = '<span style="color:red;">목록 로드 실패</span>';
            }
        }

        async function loadSelectedSheets() {
            const checkboxes = document.querySelectorAll('.lesson-check');
            let fetchPromises = [];
            words = [];
            currentIndex = 0;
            resetUI();

            checkboxes.forEach(cb => {
                if (cb.checked) {
                    const url = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(cb.value)}`;
                    fetchPromises.push(fetchSheetData(url));
                }
            });

            if (fetchPromises.length === 0) { alert("진도를 최소 하나 선택해주세요!"); return; }
            document.getElementById('quizQuestion').innerText = "로딩 중...";
            await Promise.all(fetchPromises);
            shuffleArray(words);

            if (words.length > 0) showQuestion();
            else document.getElementById('quizQuestion').innerText = "단어 없음";
        }

        async function fetchSheetData(url) {
            try {
                const response = await fetch(url);
                const data = await response.text();
                const rows = data.split('\n').map(row => row.split(',').map(cell => cell.replace(/^"|"$/g, '').trim()));
                rows.slice(1).forEach(row => {
                    if(row[0]) {
                        words.push({ question: row[0], answer: row[1], pronounce: row[2], similar: row[3] || "" });
                    }
                });
            } catch (e) { console.error(e); }
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[array[j]]] = [array[array[j]], array[i]];
            }
        }

        function showQuestion() {
            document.getElementById('quizQuestion').innerText = words[currentIndex].question;
        }

        function checkAnswer() {
            if (words.length === 0) return;
            if (isAnswerChecked) { nextQuestion(); return; }

            const currentQuiz = words[currentIndex];
            const userInput = document.getElementById('userAnswer').value.trim();
            const resultBox = document.getElementById('resultBox');
            
            let allowedAnswers = [currentQuiz.answer];
            if (currentQuiz.similar) {
                const similarList = currentQuiz.similar.split(',').map(item => item.trim());
                allowedAnswers = allowedAnswers.concat(similarList);
            }

            const isCorrect = allowedAnswers.includes(userInput);

            if (isCorrect) {
                resultBox.className = "result-area correct";
                document.getElementById('resultStatus').innerText = "⭕ 정답입니다!";
                sendStudyRecord(); // 정답 맞추면 해당 닉네임 카운트 카운트 업!
            } else {
                resultBox.className = "result-area wrong";
                document.getElementById('resultStatus').innerText = "❌ 오답입니다!";
            }

            document.getElementById('resultAnswerDisplay').innerText = `${currentQuiz.answer} [${currentQuiz.pronounce}]`;
            isAnswerChecked = true;
            document.getElementById('btnAction').innerText = "다음 단어 ➔";
        }

        function nextQuestion() {
            currentIndex = (currentIndex + 1) % words.length;
            resetUI();
            showQuestion();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') checkAnswer();
        }

        function resetUI() {
            isAnswerChecked = false;
            document.getElementById('userAnswer').value = "";
            document.getElementById('resultBox').className = "result-area";
            document.getElementById('btnAction').innerText = "확인";
        }

        window.onload = initApp;
    </script>
</body>
</html>
