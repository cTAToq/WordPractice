<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <link rel="manifest" href="manifest.json">
    <title>일본어단어장</title>
    <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #212529;
            --text-sub: #495057;
            --border-color: #ced4da;
            --shadow: rgba(0, 0, 0, 0.05);
            --shadow-lg: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-sub: #a0a0a0;
            --border-color: #444444;
            --shadow: rgba(0, 0, 0, 0.2);
            --shadow-lg: rgba(0, 0, 0, 0.4);
        }

        body { 
            font-family: sans-serif; background: var(--bg-color); color: var(--text-main);
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start; 
            min-height: 100vh; overflow-x: hidden; margin: 0; 
            /* 🛠️ 하단 바 높이 + 모바일 기기별 하단 안전 여백 확보 */
            padding: 20px 20px calc(80px + env(safe-area-inset-bottom)) 20px; 
            box-sizing: border-box; transition: background 0.3s, color 0.3s;
        }

        .theme-toggle {
            position: absolute; top: 20px; right: 20px; background: var(--card-bg); border: 2px solid var(--border-color);
            padding: 8px 12px; border-radius: 20px; cursor: pointer; font-weight: bold; color: var(--text-main); box-shadow: 0 2px 5px var(--shadow);
        }

        /* 🛠️ 모바일 스크롤 시 화면 하단에 짱짱하게 박혀있도록 개선 */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; 
            /* 기본 높이에 스마트폰 하단 홈 바(노치) 영역 자동 추가 */
            height: calc(60px + env(safe-area-inset-bottom)); 
            background: var(--card-bg); /* 테마별 배경색을 불투명하게 채워 뒤쪽 컨텐츠 비침 방지 */
            display: flex; justify-content: space-around; align-items: flex-start; /* 아이폰 노치 대응을 위해 정렬 수정 */
            border-top: 1px solid var(--border-color); box-shadow: 0 -4px 12px var(--shadow); 
            z-index: 9999; /* 단어 카드나 버튼이 위로 지나가지 못하게 최상단 레이어로 고정 */
            padding-top: 5px; box-sizing: border-box;
        }
        
        /* 🛠️ 터치 영역 확보 및 노치 기기 대응 패딩 */
        .nav-btn { 
            background: none; border: none; color: var(--text-sub); font-size: 16px; font-weight: bold; cursor: pointer; 
            width: 33.33%; height: 50px; transition: all 0.2s; 
        }
        .nav-btn.active { color: #007bff; background: rgba(0, 123, 255, 0.05); }

        .app-section { display: none; flex-direction: column; align-items: center; width: 100%; }
        .app-section.active { display: flex; }

        .options-container, .login-box, .ranking-container { 
            background: var(--card-bg); padding: 15px 25px; border-radius: 12px; 
            box-shadow: 0 4px 6px var(--shadow); margin-bottom: 15px; width: 320px; box-sizing: border-box; text-align: center;
        }
        
        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%; /* flex 안에서 최대 폭 사용 */
            min-width: 0; /* flex 내 폭 계산 문제 방지 */
        }
        @media (min-width: 1024px) {
            .checkbox-group {
                grid-template-columns: 1fr 1fr;  /* 2열 유지 */
                gap: 12px;
                max-width: 800px; /* 전체 컨테이너 넓이 늘리기 */
            }
        
            .checkbox-label {
                width: auto;  /* 개별 체크박스 폭 자동으로 늘리기 */
                min-width: 0; /* flex 내에서 올바른 폭 계산 */
            }
        }
        .user-info-display { font-size: 14px; color: var(--text-sub); margin-bottom: 8px; font-weight: bold; }

        .card-wrapper { 
            width: 320px;
            min-height: 200px;
            height: auto;
            perspective: 1000px;
            margin-bottom: 20px;
            position: relative;
        }

        .card-inner {
            width: 100%;
            min-height: 480px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
        }

        .card-inner.flipped {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            min-height: 200px;
            backface-visibility: hidden;
            border-radius: 16px;
            box-shadow: 0 4px 15px var(--shadow-lg);
            padding: 25px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
        }
        .card-back { transform: rotateY(180deg); justify-content: center; gap: 10px; }

        .question-container { width: 100%; flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 10px 0; }
        .question-text { font-size: 32px; font-weight: bold; color: var(--text-main); text-align: center; word-break: break-all; line-height: 1.45; }
        
        .answer-input { width: 100%; padding: 12px; font-size: 18px; border: 2px solid var(--border-color); background: var(--card-bg); color: var(--text-main); border-radius: 8px; box-sizing: border-box; text-align: center; outline: none; margin-top: auto; }
        .answer-input:focus { border-color: #007bff; }
        
        .choice-group { display: none; flex-direction: column; gap: 8px; width: 100%; margin-top: auto; }
        .choice-btn {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-main);
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-weight: bold;
            transition: all 0.15s ease;
            touch-action: manipulation;
        }
        .choice-btn:hover { background: rgba(0, 123, 255, 0.1); border-color: #007bff; }
        .choice-btn:active {
            transform: scale(0.98);
        }
        .choice-btn,
        .btn-main,
        .nav-btn {
            -webkit-tap-highlight-color: transparent;
        }

        .result-title { font-size: 26px; font-weight: bold; margin-bottom: 10px; }
        .result-title.correct { color: #28a745; }
        .result-title.wrong { color: #dc3545; }
        .final-display { font-size: 28px; font-weight: bold; color: var(--text-main); margin-top: 5px; text-align: center; }
        .pronounce-display { font-size: 18px; color: var(--text-sub); margin-top: 5px; text-align: center; }

        .btn-main { width: 320px; padding: 14px; font-size: 18px; border-radius: 8px; border: none; background: #007bff; color: white; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }

        .rank-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 15px; }
        .rank-table th, .rank-table td { padding: 10px 5px; border-bottom: 1px solid var(--border-color); text-align: center; }
        .rank-table th { color: var(--text-sub); font-weight: bold; }
        .rank-row-1 { font-weight: bold; color: #ffd700; }
        .rank-row-2 { font-weight: bold; color: #c0c0c0; }
        .rank-row-3 { font-weight: bold; color: #cd7f32; }
    </style>
</head>
<body>

    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 다크모드</button>

    <div id="wordSection" class="app-section active">
        <div class="login-box">
            <div class="user-info-display" id="userInfoText">👤 내 닉네임 설정</div>
            <input type="text" id="nicknameInput" style="padding:8px; border:2px solid #007bff; border-radius:6px; width:85%; text-align:center; font-size:15px; font-weight:bold; background: var(--card-bg); color: var(--text-main);" placeholder="닉네임을 입력하고 엔터" onkeypress="changeNickname(event)">
        </div>

        <div class="options-container">
            <div style="font-weight: bold; color: var(--text-sub);">📖 학습할 진도 선택</div>
            <div class="checkbox-group" id="checkboxGroup">
                <span style="color:#888; font-size:14px;">진도 목록 불러오는 중...</span>
            </div>
        </div>

        <div class="card-wrapper">
            <div class="card-inner" id="cardInner">
                <div class="card-front">
                    <div class="question-container">
                        <div class="question-text" id="quizQuestion">진도를 선택해 주세요</div>
                    </div>
                    <input
                        type="text"
                        class="answer-input"
                        id="userAnswer"
                        placeholder="정답을 입력하세요"
                        onkeypress="handleKeyPress(event)"
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="off"
                        spellcheck="false"
                        inputmode="search">
                    <div class="choice-group" id="choiceGroup">
                        <button class="choice-btn" onclick="selectChoice(1)" id="c1">1. </button>
                        <button class="choice-btn" onclick="selectChoice(2)" id="c2">2. </button>
                        <button class="choice-btn" onclick="selectChoice(3)" id="c3">3. </button>
                        <button class="choice-btn" onclick="selectChoice(4)" id="c4">4. </button>
                    </div>
                </div>
                <div class="card-back" id="resultBox">
                    <div class="result-title" id="resultStatus">⭕ 정답입니다!</div>
                    <div class="final-display" id="resultAnswerDisplay">-</div>
                    <div class="pronounce-display" id="resultPronounceDisplay">[-]</div>
                    <button
                        onclick="speakJapanese(words[currentIndex].answer)"
                        
                        style="
                            margin-top:8px;
                            padding:8px 14px;
                            border:none;
                            border-radius:8px;
                            background:#007bff;
                            color:white;
                            font-size:16px;
                            cursor:pointer;
                        ">
                        🔊
                    </button>
                    <div class="pronounce-display" id="resultCategoryDisplay">[유형]</div>
                    <div class="pronounce-display" id="streakDisplay">🔥 0연속 정답</div>
                    <div class="pronounce-display" id="wrongScoreDisplay"> ⚠️ 오답점수 : 0 </div>
                </div>
            </div>
        </div>
        <button class="btn-main" id="btnAction" onclick="handleMainButton()">확인</button>
        <button id="installBtn" onclick="installApp()" style="display:block; width:50px; margin-top:10px; padding:14px; border:none; border-radius:8px; background:#143f66; color:white; font-size:16px; font-weight:bold; cursor:pointer;">📲</button>
    </div>

    <div id="rankSection" class="app-section">
        <div class="ranking-container">
            <div style="font-weight: bold; font-size: 18px; color: #007bff; margin-bottom: 5px;">🏆 주간 랭킹 🏆</div>
            <div style="font-size: 12px; color: var(--text-sub); margin-bottom: 10px;">최근 7일간 정답을 맞힌 횟수 누적 기준</div>
            <table class="rank-table">
                <thead>
                    <tr>
                        <th style="width: 20%;">순위</th>
                        <th style="width: 50%;">닉네임</th>
                        <th style="width: 30%;">공부횟수</th>
                    </tr>
                </thead>
                <tbody id="rankTableBody">
                    <tr><td colspan="3" style="color:#888;">랭킹 데이터를 불러오는 중...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="statsSection" class="app-section">
        <div class="ranking-container">
            <div style="font-weight:bold; font-size:18px; color:#28a745; margin-bottom:15px;">📊 내 학습 통계</div>
            <div id="statsContent">불러오는 중...</div>
            <canvas id="studyChart" style="margin-top:20px;"></canvas>
            <canvas id="accuracyChart" style="margin-top:20px;"></canvas>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-btn active" id="navWordBtn" onclick="switchTab('word')">✏️ 단어장</button>
        <button class="nav-btn" id="navRankBtn" onclick="switchTab('rank')">🏆 주간 랭킹</button>
        <button class="nav-btn" id="navStatsBtn" onclick="switchTab('stats')">📊 내 통계</button>
    </nav>

    <script>
        const spreadsheetId = "1P-EpIcEFuGvFO7kLzE4RuzZy4NxHuofPArlszI6VT2s";
        const scriptUrl = "https://script.google.com/macros/s/AKfycbyjrEMBl-b2b3jcUewUh5mEv3zLWIZyp14DRrwjBG_kCp1FVcBDJgVPIc6qkr7495SbFg/exec";
        
        let words = [];
        let currentIndex = 0;
        let isAnswerChecked = false;
        let userNickname = "";
        let deferredPrompt = null;
        let studyChartInstance = null;
        let accuracyChartInstance = null;
        let originalWords = [];
        let streak = 0;
        let wrongMap = {};

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker
                .register('/sw.js')
                .then(() => {
                    console.log('SW 등록 완료');
                });
        }

        function switchTab(tab) {
            document.querySelectorAll('.app-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if(tab === 'word') {
                document.getElementById('wordSection').classList.add('active');
                document.getElementById('navWordBtn').classList.add('active');
            } else if(tab === 'rank') {
                document.getElementById('rankSection').classList.add('active');
                document.getElementById('navRankBtn').classList.add('active');
                loadRankingData();
            } else if(tab === 'stats') {
                document.getElementById('statsSection').classList.add('active');
                document.getElementById('navStatsBtn').classList.add('active');
                loadMyStats();
            }
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.getElementById('themeBtn').innerText = savedTheme === 'dark' ? '☀️ 라이트모드' : '🌙 다크모드';
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            document.getElementById('themeBtn').innerText = newTheme === 'dark' ? '☀️ 라이트모드' : '🌙 다크모드';
        }

        function initUser() {
            userNickname = localStorage.getItem('study_nickname');
            if(!userNickname) {
                userNickname = ""; 
                localStorage.setItem('study_nickname', userNickname);
            }
            document.getElementById('nicknameInput').value = userNickname;
            updateUserDisplay();
        }

        function changeNickname(e) {
            if (e.key === 'Enter') {
                const newName = document.getElementById('nicknameInput').value.trim();
                if(newName) {
                    userNickname = newName;
                    localStorage.setItem('study_nickname', userNickname);
                    updateUserDisplay();
                    alert(`닉네임이 '${userNickname}'(으)로 설정되었습니다!`);
                }
            }
        }

        function updateUserDisplay() {
            document.getElementById('userInfoText').innerText = userNickname ? `👤 현재 사용자: ${userNickname}` : `👤 내 닉네임 설정`;
        }

        async function sendStudyRecord(question, isCorrect, category) {
            if(!scriptUrl.includes("macros/s/")) return;
            
            const payload = {
                nickname: userNickname || "익명",
                question: question,
                category: category,
                isCorrect: isCorrect,
                timestamp: new Date().toISOString()
            };
        
            try {
                fetch(scriptUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
            } catch(e) {
                console.error("기록 전송 실패:", e);
            }
        }

        async function initApp() {
            initTheme();
            initUser();
            wrongMap = JSON.parse(
                localStorage.getItem('wrongMap')
            ) || {};
            try {
                const url = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:csv&sheet=설정`;
                const response = await fetch(url);
                const data = await response.text();
                const rows = data.replace(/"/g, '').split('\n').map(row => row.trim());
                const checkboxGroup = document.getElementById('checkboxGroup');
                checkboxGroup.innerHTML = '';

                let count = 0;
                rows.slice(1).forEach(sheetName => {
                    if (sheetName) {
                        const checked = count === 0 ? 'checked' : '';
                        checkboxGroup.innerHTML += `
                            <label class="checkbox-label">
                                <input type="checkbox" class="lesson-check" value="${sheetName}" ${checked} onclick="loadSelectedSheets()"> ${sheetName}
                            </label>
                        `;
                        count++;
                    }
                });
                checkboxGroup.innerHTML += `
                    <label class="checkbox-label">
                        <input type="checkbox"
                            class="lesson-check"
                            value="wrong-note"
                            onclick="loadSelectedSheets()">
                        ❌ 오답노트
                    </label>
                `;
                if(count > 0) loadSelectedSheets();
            } catch (e) {
                document.getElementById('checkboxGroup').innerHTML = '<span style="color:red;">목록 로드 실패</span>';
            }
        }

        async function loadSelectedSheets() {
            const checkboxes = document.querySelectorAll('.lesson-check');
            const wrongMode =
                document.querySelector(
                    '.lesson-check[value="wrong-note"]'
                )?.checked;
            let fetchPromises = [];
            currentIndex = 0;
            resetCardUI();

            checkboxes.forEach(cb => {
                if (cb.checked && cb.value !== "wrong-note") {
                    const url = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(cb.value)}`;
                    fetchPromises.push(fetchSheetData(url));
                }
            });

            if (fetchPromises.length === 0) { 
                words = [];
                document.getElementById('quizQuestion').innerText = "진도를 선택해 주세요"; 
                return; 
            }
            
            document.getElementById('quizQuestion').innerText = "로딩 중...";
            const results = await Promise.all(fetchPromises);
            
            let singleBasket = [];
            results.forEach(arr => {
                if(arr && arr.length > 0) {
                    singleBasket = singleBasket.concat(arr);
                }
            });
            
            if (singleBasket.length === 0) {
                words = [];
                document.getElementById('quizQuestion').innerText = "단어 없음";
                return;
            }

            words = singleBasket;
            originalWords = [...words];

            if(wrongMode) {

                words = words.filter(word =>
            
                    (wrongMap[word.question] || 0) > 0
                );
            
                if(words.length === 0) {
            
                    alert("오답 문제가 없습니다 🎉");
                }
            }
            originalWords = [...words];
            shuffleArray(words);

            if (words.length > 0) showQuestion();
            else document.getElementById('quizQuestion').innerText = "단어 없음";
        }

        async function fetchSheetData(url) {
            let tempArray = [];
            try {
                const response = await fetch(url);
                const csvText = await response.text();
                const parsed = Papa.parse(csvText.trim());
                const rows = parsed.data;
        
                rows.slice(1).forEach(cells => {
                    if (!cells || cells.length < 2) return;
        
                    tempArray.push({
                        question: (cells[0] || "").trim(),
                        answer: (cells[1] || "").trim(),
                        pronounce: (cells[2] || "").trim(),
                        similar: (cells[3] || "").trim(),
                        type: (cells[4] || "주관식").trim(),
                        c1: (cells[5] || "").trim(),
                        c2: (cells[6] || "").trim(),
                        c3: (cells[7] || "").trim(),
                        c4: (cells[8] || "").trim(),
                        category: (cells[9] || "미분류").trim()
                    });
                });
                return tempArray;
            } catch (e) {
                console.error(e);
                return [];
            }
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const temp = array[i];
                array[i] = array[j];
                array[j] = temp;
            }
        }
        function speakJapanese(text) {
            

            speechSynthesis.cancel();
        
            const utterance =
                new SpeechSynthesisUtterance(text);
        
            utterance.lang = 'ja-JP';
        
            utterance.rate = 0.9;
        
            speechSynthesis.speak(utterance);
        }

        function speakCurrentSentence() {

            const currentQuiz = words[currentIndex];
        
            let textToSpeak = currentQuiz.question;
        
            textToSpeak =
                textToSpeak.replace(/[＿_]+/g, '');
        
            textToSpeak =
                textToSpeak.replace(/\s+/g, '');
        
            if(currentQuiz.answer) {
        
                textToSpeak =
                    textToSpeak.replace(
                        /([はがをにでと])([。？?])/,
                        currentQuiz.answer + '$1$2'
                    );
            }
        
            speakJapanese(textToSpeak);
        }

        function showQuestion() {
            if(words.length === 0) return;
            
            const currentQuiz = words[currentIndex];
            if(!currentQuiz) return;
            const qTextElem = document.getElementById('quizQuestion');
            qTextElem.innerText = currentQuiz.question;
            document.getElementById('btnAction').innerText = "확인";
            
            if(currentQuiz.question.length > 20) {

                qTextElem.style.fontSize = "18px";
            
            } else if(currentQuiz.question.length > 10) {
            
                qTextElem.style.fontSize = "22px";
            
            } else if(currentQuiz.question.length > 6) {
            
                qTextElem.style.fontSize = "28px";
            
            } else {
            
                qTextElem.style.fontSize = "38px";
            }

            const inputElem = document.getElementById('userAnswer');
            const choiceElem = document.getElementById('choiceGroup');
            console.log("타입확인:", "[" + currentQuiz.type + "]");
            
            if (currentQuiz.type.trim() === "객관식") {

                inputElem.style.display = "none";
                choiceElem.style.display = "flex";

                document.getElementById('userAnswer').blur();
                document.getElementById('btnAction').style.display = "none";
                const choices = [
                    currentQuiz.c1,
                    currentQuiz.c2,
                    currentQuiz.c3,
                    currentQuiz.c4
                ];
                
                shuffleArray(choices);
                
                document.getElementById('c1').innerText = `1. ${choices[0]}`;
                document.getElementById('c1').dataset.answer = choices[0];
                
                document.getElementById('c2').innerText = `2. ${choices[1]}`;
                document.getElementById('c2').dataset.answer = choices[1];
                
                document.getElementById('c3').innerText = `3. ${choices[2]}`;
                document.getElementById('c3').dataset.answer = choices[2];
                
                document.getElementById('c4').innerText = `4. ${choices[3]}`;
                document.getElementById('c4').dataset.answer = choices[3];
            
            } else {
            
                choiceElem.style.display = "none";
                inputElem.style.display = "block";
            
                document.getElementById('btnAction').style.display = "block";
            
                inputElem.focus();
            }
        }

        function handleMainButton() {
            if (isAnswerChecked) { nextQuestion(); } 
            else { checkAnswer(document.getElementById('userAnswer').value.trim()); }
        }

        function selectChoice(num) {
            if (isAnswerChecked) return;
            const currentQuiz = words[currentIndex];
            const btn = document.getElementById("c" + num);

            btn.style.background = "rgba(0, 123, 255, 0.2)";
            btn.style.borderColor = "#007bff";
            
            const selectedText = btn.dataset.answer;
            
            setTimeout(() => {
                checkAnswer(selectedText);
            }, 120);
        }

        function checkAnswer(userInput) {
            if (isAnswerChecked) return;
            document.querySelectorAll('.choice-btn').forEach(btn => {
                btn.disabled = true;
            });
            if (words.length === 0) return;

            const currentQuiz = words[currentIndex];
            const statusBox = document.getElementById('resultStatus');
            
            const cleanUserInput = userInput.replace(/\s+/g, '');

            let allowedAnswers = [currentQuiz.answer];
            if (currentQuiz.similar) {
                const similarList = currentQuiz.similar
                    .split('|')
                    .map(item => item.trim())
                    .filter(item => item);
                allowedAnswers = allowedAnswers.concat(similarList);
            }

            const isCorrect = allowedAnswers.some(ans => {
                const cleanAns = ans.replace(/\s+/g, '');
                return cleanAns === cleanUserInput;
            });

            if (isCorrect) {
                if(wrongMap[currentQuiz.question]) {

                    wrongMap[currentQuiz.question]--;
                
                    if(wrongMap[currentQuiz.question] < 0) {
                        wrongMap[currentQuiz.question] = 0;
                    }
                    if(
                        document.querySelector(
                            '.lesson-check[value="wrong-note"]'
                        )?.checked
                    ) {
                    
                        words = words.filter(word =>
                            (wrongMap[word.question] || 0) > 0
                        );
                    
                        if(currentIndex >= words.length) {
                            currentIndex = 0;
                        }
                        if(words.length === 0) {

                            document.getElementById('quizQuestion').innerText =
                                "🎉 틀린 문제가 없어요! 🎉\n 틀려오세요!";
                        
                            document.getElementById('cardInner')
                                .classList.remove('flipped');
                        
                            document.getElementById('btnAction').style.display =
                                "none";
                        
                            return;
                        }
                    }
                
                    localStorage.setItem(
                        'wrongMap',
                        JSON.stringify(wrongMap)
                    );
                }
                streak++;
                statusBox.innerText = "⭕ 정답입니다!";
                statusBox.className = "result-title correct";
                sendStudyRecord(
                    currentQuiz.question,
                    true,
                    currentQuiz.category
                );
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });
                document.getElementById('streakDisplay').innerText =
                    `🔥 ${streak}연속 정답`;
            } else {
                streak = 0;
                if(!wrongMap[currentQuiz.question]) {
                    wrongMap[currentQuiz.question] = 0;
                }
                
                wrongMap[currentQuiz.question]++;
                
                localStorage.setItem(
                    'wrongMap',
                    JSON.stringify(wrongMap)
                );
                statusBox.innerText = "❌ 오답입니다!";
                statusBox.className = "result-title wrong";
                sendStudyRecord(
                    currentQuiz.question,
                    false,
                    currentQuiz.category
                );
            }

            document.getElementById('resultAnswerDisplay').innerText = currentQuiz.answer;
            document.getElementById('resultPronounceDisplay').innerText = `[${currentQuiz.pronounce}]`;
            document.getElementById('resultCategoryDisplay').innerText =
                `📚 유형 : ${currentQuiz.category}`;
            document.getElementById('wrongScoreDisplay').innerText =
                `⚠️ 오답점수 : ${wrongMap[currentQuiz.question] || 0}`;
            document.getElementById('cardInner').classList.add('flipped');
            isAnswerChecked = true;
            
            document.getElementById('btnAction').style.display = "block";
            document.getElementById('btnAction').innerText = "다음";
        }

        function nextQuestion() {
            currentIndex = (currentIndex + 1) % words.length;
            resetCardUI();
            setTimeout(() => {

                showQuestion();
            
                const currentQuiz = words[currentIndex];
            
                if(currentQuiz.type.trim() !== "객관식") {
                    document.getElementById('userAnswer').focus();
                }
            
            }, 250);
        }

        function handleKeyPress(e) {

            if(words.length === 0) return;

            const currentQuiz = words[currentIndex];
        
            if(!currentQuiz) return;
        
            if(currentQuiz.type.trim() === "객관식") return;
        
            if (e.key === 'Enter') {
                handleMainButton();
            }
        }
        document.addEventListener('keydown', function(e) {
            if(words.length === 0) return;
            const currentQuiz = words[currentIndex];
            if(currentQuiz.type.trim() !== "객관식") return;
            if(isAnswerChecked) return;

            switch(e.key) {
                case '1': selectChoice(1); break;
                case '2': selectChoice(2); break;
                case '3': selectChoice(3); break;
                case '4': selectChoice(4); break;
            }
        });

        function resetCardUI() {
            isAnswerChecked = false;
            document.getElementById('userAnswer').value = "";
            document.getElementById('cardInner').classList.remove('flipped');
            document.getElementById('btnAction').innerText = "확인";
            document.getElementById('btnAction').style.display = "block";
            document.querySelectorAll('.choice-btn').forEach(btn => {

                btn.disabled = false;
            
                btn.style.background = "";
                btn.style.borderColor = "";
            });
        }

        async function loadRankingData() {
            const tableBody = document.getElementById('rankTableBody');
            tableBody.innerHTML = `<tr><td colspan="3" style="color:#888;">데이터 집계 중...</td></tr>`;
        
            try {
                const url = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:csv&sheet=기록`;
                const response = await fetch(url);
                const csvText = await response.text();
                const parsed = Papa.parse(csvText.trim());
                const rows = parsed.data.slice(1);
                const weeklyScores = {};
                const now = new Date();
        
                rows.forEach(row => {
                    if (!row[0] || !row[1]) return;
                    const recordDate = new Date(row[0]);
                    const nickname = row[1];
                    const isCorrect = String(row[3]).toUpperCase() === "TRUE";
                    const diffDays = (now - recordDate) / (1000 * 60 * 60 * 24);
        
                    if (diffDays <= 7 && isCorrect) {
                        if (!weeklyScores[nickname]) { weeklyScores[nickname] = 0; }
                        weeklyScores[nickname]++;
                    }
                });
        
                const rankingList = Object.entries(weeklyScores).sort((a,b) => b[1] - a[1]);
                tableBody.innerHTML = "";
        
                if (rankingList.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="3" style="color:#888;">최근 7일간 학습 기록이 없습니다.</td></tr>`;
                    return;
                }
        
                rankingList.forEach((user, idx) => {
                    const rank = idx + 1;
                    let rowClass = "";
                    if(rank <= 3) { rowClass = `class="rank-row-${rank}"`; }
                    tableBody.innerHTML += `
                        <tr ${rowClass}>
                            <td>${rank}등</td>
                            <td>${user[0]}</td>
                            <td>${user[1]}회</td>
                        </tr>
                    `;
                });
            } catch(e) {
                console.error(e);
                tableBody.innerHTML = `<tr><td colspan="3" style="color:red;">랭킹 로드 실패</td></tr>`;
            }
        }

        async function loadMyStats() {

            const statsBox = document.getElementById('statsContent');
            statsBox.innerHTML = "통계 계산 중...";
        
            try {
        
                const url = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:csv&sheet=기록`;
        
                const response = await fetch(url);
                const csvText = await response.text();
        
                const parsed = Papa.parse(csvText.trim());
                const rows = parsed.data.slice(1);
        
                const myRows = rows.filter(row => row[1] === userNickname);
        
                const totalCount = myRows.length;
        
                const correctCount = myRows.filter(
                    row => String(row[3]).toUpperCase() === "TRUE"
                ).length;
        
                const wrongRows = myRows.filter(
                    row => String(row[3]).toUpperCase() === "FALSE"
                );
                const wrongCategory = {};

                wrongRows.forEach(row => {
                
                    const category = row[4] || "미분류";
                
                    if(!wrongCategory[category]) {
                        wrongCategory[category] = 0;
                    }
                
                    wrongCategory[category]++;
                });
                let categoryHtml = "";

                if(Object.keys(wrongCategory).length === 0) {
                
                    categoryHtml = `
                        <div style="color:#888;">
                            아직 오답 데이터 없음 🎉
                        </div>
                    `;
                
                } else {
                
                    categoryHtml = Object.entries(wrongCategory)
                        .sort((a,b) => b[1] - a[1])
                        .slice(0,5)
                        .map(item => `
                            <div style="
                                padding:6px;
                                border-bottom:1px solid #444;
                                font-size:14px;
                            ">
                                ${item[0]} : ${item[1]}회
                            </div>
                        `).join("");
                }
                        
                const accuracy = totalCount > 0
                    ? Math.round((correctCount / totalCount) * 100)
                    : 0;
        
                const today = new Date().toISOString().slice(0,10);
        
                const todayCount = myRows.filter(
                    row => row[0] && row[0].startsWith(today)
                ).length;
        
                let wrongHtml = "";
        
                wrongRows.slice(-5).reverse().forEach(row => {
        
                    wrongHtml += `
                        <div style="
                            padding:6px;
                            border-bottom:1px solid #444;
                            font-size:14px;
                        ">
                            ❌ ${row[2]}
                        </div>
                    `;
                });
        
                if(wrongHtml === "") {
        
                    wrongHtml = `
                        <div style="color:#888;">
                            최근 오답 없음 🎉
                        </div>
                    `;
                }
        
                statsBox.innerHTML = `
                    <div style="margin-bottom:12px;">
                        📚 총 학습: <b>${totalCount}문제</b>
                    </div>
        
                    <div style="margin-bottom:12px;">
                        ⭕ 정답률: <b>${accuracy}%</b>
                    </div>
        
                    <div style="margin-bottom:20px;">
                        🔥 오늘 푼 문제: <b>${todayCount}문제</b>
                    </div>
        
                    <div style="
                        font-weight:bold;
                        margin-bottom:10px;
                    ">
                        최근 오답
                    </div>
        
                    ${wrongHtml}
                    <div style="
                    font-weight:bold;
                    margin-top:20px;
                    margin-bottom:10px;
                ">
                    💀 많이 틀린 유형
                </div>
                ${categoryHtml}
                `;
                
        
                // =========================
                // 날짜별 데이터 집계
                // =========================
        
                const dailyStudy = {};
                const dailyAccuracy = {};
        
                myRows.forEach(row => {
        
                    if(!row[0]) return;

                    const date = row[0].slice(0,10);
        
                    const isCorrect =
                        String(row[3]).toUpperCase() === "TRUE";
        
                    // 학습량
                    if(!dailyStudy[date]) {
                        dailyStudy[date] = 0;
                    }
        
                    dailyStudy[date]++;
        
                    // 정답률
                    if(!dailyAccuracy[date]) {
        
                        dailyAccuracy[date] = {
                            total: 0,
                            correct: 0
                        };
                    }
        
                    dailyAccuracy[date].total++;
        
                    if(isCorrect) {
                        dailyAccuracy[date].correct++;
                    }
                });
        
                // =========================
                // 기존 그래프 제거
                // =========================
        
                if(studyChartInstance) {
                    studyChartInstance.destroy();
                }
        
                if(accuracyChartInstance) {
                    accuracyChartInstance.destroy();
                }
        
                // =========================
                // 학습량 그래프
                // =========================
        
                const studyLabels = Object.keys(dailyStudy);
        
                const studyData = Object.values(dailyStudy);
        
                studyChartInstance = new Chart(
                    document.getElementById('studyChart'),
                    {
                        type: 'bar',
        
                        data: {
                            labels: studyLabels,
        
                            datasets: [{
                                label: '일별 학습량',
                                data: studyData
                            }]
                        },
        
                        options: {
                            responsive: true
                        }
                    }
                );
        
                // =========================
                // 정답률 그래프
                // =========================
        
                const accuracyLabels =
                    Object.keys(dailyAccuracy);
        
                const accuracyData =
                    accuracyLabels.map(date => {
        
                        const item = dailyAccuracy[date];
        
                        return Math.round(
                            (item.correct / item.total) * 100
                        );
                    });
        
                accuracyChartInstance = new Chart(
                    document.getElementById('accuracyChart'),
                    {
                        type: 'line',
        
                        data: {
                            labels: accuracyLabels,
        
                            datasets: [{
                                label: '정답률 추이',
                                data: accuracyData
                            }]
                        },
        
                        options: {
                            responsive: true,
                            scales: {
                                y: {
                                    min: 0,
                                    max: 100
                                }
                            }
                        }
                    }
                );
        
            } catch(e) {
        
                console.error(e);
        
                statsBox.innerHTML = `
                    <span style="color:red;">
                        통계 로드 실패
                    </span>
                `;
            }
        }

        window.addEventListener('load', initApp);
        
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').style.display = 'block';
        });

        async function installApp() {
            if (!deferredPrompt) {
                alert("현재 설치를 지원하지 않는 환경입니다.");
                return;
            }
            deferredPrompt.prompt();
            const result = await deferredPrompt.userChoice;
            if (result.outcome === 'accepted') { console.log("설치 완료"); }
            deferredPrompt = null;
            document.getElementById('installBtn').style.display = 'none';
        }
    </script>
</body>
